###############################################################################
# ECOWITTSEASONS SKIN CONFIGURATION FILE                                      #
# The WeeWX Seasons skin for Ecowitt gateways:                                #
#  - current conditions and sensor status live from ecwLoop.json              #
#    (weewx-ecowittGateway)                                                   #
#  - interactive charts (weewx-echarts) instead of the PNG plots              #
#  - only values that are present are shown                                   #
#  - the green (teal) colours of the WeeWX documentation                      #
#                                                                             #
# Seasons: Copyright (c) 2018-2021 Tom Keffer and Matthew Wall.               #
# weewx-ecowittSeasonsLive: Copyright (C) 2026 Ian Millard                    #
# Distributed under terms of GPLv3.  See LICENSE for your rights.             #
#                                                                             #
# Settings here can be overridden in weewx.conf under                         #
# [StdReport] [[ecowittSeasons]], where they survive upgrades.                #
###############################################################################

SKIN_NAME = ecowittSeasons
SKIN_VERSION = 1.0.0

###############################################################################

[Extras]

    # This radar image would be available as $Extras.radar_img
    # radar_img = https://radblast.wunderground.com/cgi-bin/radar/WUNIDS_map?station=RTX&brand=wui&num=18&delay=15&type=N0R&frame=0&scale=1.000&noclutter=1&showlabels=1&severe=1
    # radar_url = https://radar.weather.gov/

    # Similar to radar, but for satellite image.
    #satellite_img = http://images.intellicast.com/WxImages/SatelliteLoop/hipacsat_None_anim.gif
    #satellite_url = http://images.intellicast.com/WxImages/SatelliteLoop/hipacsat_None_anim.gif

    # To display a map, enter an API key for google maps
    #google_maps_apikey = xxx

    # If you have a Google Analytics GA4 tag, uncomment and edit the next line
    #googleAnalyticsId = G-ABCDEFGHI

    # light, dark, or auto (follows the visitor's system setting)
    theme = auto
    # The light/dark button in the title bar
    theme_toggle_enabled = 1
    # The button that switches charts and current conditions between metric and US units
    unit_switch_enabled = 1

    # Charts: leave out lines (and charts) of observations with no data in the last hide_empty_days days
    hide_empty_charts = 1
    hide_empty_days = 30

    # The chart builder page (chart-builder/), which writes charts.conf sections for you
    chart_builder_enabled = 1

    # Locale for dates and numbers in the charts: auto (from lang), or a name such as de_DE
    echarts_locale = auto
    # Decimal point and thousands separator in charts: auto (from the locale), or the characters to use
    chart_decimal = auto
    chart_thousands = auto
    # 1 writes chart details to the browser console
    echarts_debug = 0

###############################################################################

# Live current conditions, drawn from ecwLoop.json while the page is open.
#
# weewx-ecowittGateway writes ecwLoop.json when it is enabled in weewx.conf:
#     [EcowittGateway]
#         [[loop_json]]
#             enable = True
# The skin finds it from those settings. Each row below is shown only while its field has a value.

[LiveConditions]

    # Where ecwLoop.json is, relative to this report's pages. Empty: worked out from [EcowittGateway] [[loop_json]].
    url = ""
    # Seconds between reads of ecwLoop.json
    poll_interval = 10
    # Data older than this (seconds) is marked as not live
    stale_after = 120
    # True adds an "Other" section with every reading of ecwLoop.json not listed below
    show_unlisted = False

    # The sections of the current conditions, in order. "fields" lists the rows: a field of ecwLoop.json,
    # or two joined with + to show them on one row (eg temperature and humidity of one channel).
    # A section's title is a label of [Labels] [[Generic]]; a row's label is the label of its first field.
    [[sections]]
        [[[outdoor]]]
            title = live_outdoor
            fields = outTemp, feelslike, appTemp, heatindex, windchill, humidex, dewpoint, outHumidity, vpd, barometer, pressure, relbarometer, cloudbase
        [[[wind]]]
            title = live_wind
            fields = windSpeed+windDir, windGust, windDir10, daymaxwind
        [[[rain]]]
            title = live_rain
            fields = is_raining, rainRate, t_rainrate, p_rainrate, t_rainhour, p_rainhour, t_rainday, p_rainday, t_rainevent, p_rainevent, t_rain24, p_rain24, t_rainweek, p_rainweek, t_rainmonth, p_rainmonth, t_rainyear, p_rainyear
        [[[sun]]]
            title = live_sun
            fields = UV, radiation, illuminance, uvradiation, maxSolarRad
        [[[lightning]]]
            title = live_lightning
            fields = lightningcount, lightning_strike_count, lightningdist, lightning_distance, lightningdettime
        [[[indoor]]]
            title = live_indoor
            fields = inTemp+inHumidity, co2_in, co2_in_24h_avg
        [[[air]]]
            title = live_air
            fields = pm2_5, pm2_51_24h_avg, pm25_ch1_real, pm2_52, pm2_52_24h_avg, pm25_ch2_real, pm2_53, pm2_53_24h_avg, pm25_ch3_real, pm2_54, pm2_54_24h_avg, pm25_ch4_real, pm2_55, pm2_55_24h_avg, pm25_co2_real, pm1_0, pm1_0_24h_avg, pm4_0, pm4_0_24h_avg, pm10_0, pm10_24h_avg, pm10_co2_real, co2, co2_24h_avg, co2_temp+co2_humidity
        [[[channels]]]
            title = live_channels
            fields = extraTemp1+extraHumid1, extraTemp2+extraHumid2, extraTemp3+extraHumid3, extraTemp4+extraHumid4, extraTemp5+extraHumid5, extraTemp6+extraHumid6, extraTemp7+extraHumid7, extraTemp8+extraHumid8, extraTemp9, extraTemp10, extraTemp11, extraTemp12, extraTemp13, extraTemp14, extraTemp15, extraTemp16
        [[[soil]]]
            title = live_soil
            fields = soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilMoist1, soilMoist2, soilMoist3, soilMoist4, soilMoist5, soilMoist6, soilMoist7, soilMoist8, soilMoist9, soilMoist10, soilMoist11, soilMoist12, soilMoist13, soilMoist14, soilMoist15, soilMoist16
        [[[leaf]]]
            title = live_leaf
            fields = leafWet1, leafWet2, leafWet3, leafWet4, leafWet5, leafWet6, leafWet7, leafWet8
        [[[leak]]]
            title = live_leak_title
            fields = leak1, leak2, leak3, leak4
        [[[depth]]]
            title = live_depth
            fields = depth1, air1, heat1, depth2, air2, heat2, depth3, air3, heat3, depth4, air4, heat4

# The sensor status widget: the *_batt, *_sig and *_volt fields of ecwLoop.json, one row per sensor
[LiveSensors]

    # A battery at or below this voltage is low (sensors that report volts)
    low_volts = 1.2

    # How each sensor model reports its battery: binary (0 OK, 1 low), level (0-5, 0 or 1 low, 6 DC) or volts.
    # weewx-ecowittGateway reports volts for the WH40, WH51, WH68, WS80, WS90, WN34 and WN35.
    [[battery]]
        wh25 = binary
        wh26 = binary
        wn31 = binary
        wh65 = binary
        wh69 = binary
        wh32 = binary
        wh40 = volts
        wh51 = volts
        wh68 = volts
        ws80 = volts
        ws90 = volts
        wn34 = volts
        wn35 = volts
        wh41 = level
        wh45 = level
        wh46 = level
        wh54 = level
        wh55 = level
        wh57 = level
        ws85 = level

    # Names of the sensors: a model (wh26) or a model and channel (wn31_ch1, as in the field names)
    [[names]]
        wh25 = Indoor T/H/P (WH25)
        wh26 = Outdoor T/H (WH26)
        wh32 = Outdoor T/H (WH32)
        wh40 = Rain gauge (WH40)
        wh45 = Air quality (WH45)
        wh46 = Air quality (WH46)
        wh57 = Lightning (WH57)
        wh65 = Weather array (WH65)
        wh68 = Weather array (WH68)
        wh69 = Weather array (WH69)
        ws80 = Ultrasonic array (WS80)
        ws85 = Wind and rain (WS85)
        ws90 = Weather array (WS90)
        wn31 = Temp/humidity (WN31)
        wn34 = Temperature (WN34)
        wn35 = Leaf wetness (WN35)
        wh41 = PM2.5 (WH41)
        wh51 = Soil moisture (WH51)
        wh54 = Laser distance (WH54)
        wh55 = Water leak (WH55)

###############################################################################

# The following section contains variables that determine which observations
# will be shown in the template files, and their order.  Like other
# configuration options, these can be overridden in the weewx config file.
# Observations with no data are not shown.

[DisplayOptions]

    # Show link to RSS feed?
    show_rss = True

    # Show link to NOAA-style summary reports?
    show_reports = True

    # Current conditions without JavaScript (the live widget uses [LiveConditions])
    observations_current = outTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rainRate, UV, radiation, lightning_strike_count, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, pm1_0, pm2_5, pm10_0, co2

    # This list determines which types will appear in the "statistics" and
    # "statistical summary" sections, as well as in which order.
    observations_stats = outTemp, appTemp, heatindex, windchill, dewpoint, outHumidity, barometer, windSpeed, rain, rainRate, p_rain, p_rainrate, t_rain, t_rainrate, ET, hail, hailRate, snow, UV, radiation, illuminance, lightning_strike_count, lightning_distance, inTemp, inHumidity, extraTemp1, extraHumid1, extraTemp2, extraHumid2, extraTemp3, extraHumid3, extraTemp4, extraHumid4, extraTemp5, extraHumid5, extraTemp6, extraHumid6, extraTemp7, extraHumid7, extraTemp8, extraHumid8, leafTemp1, leafTemp2, leafWet1, leafWet2, leafWet3, leafWet4, soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilMoist1, soilMoist2, soilMoist3, soilMoist4, soilMoist5, soilMoist6, soilMoist7, soilMoist8, pm1_0, pm2_5, pm10_0, co, co2, nh3, no2, o3, so2

    # This list determines which types will appear in the RSS feed.
    observations_rss = outTemp, inTemp, barometer, windSpeed, rain, rainRate, windchill, heatindex, dewpoint, outHumidity, inHumidity

    # Some observations display a sum rather than min/max values
    obs_type_sum = rain, p_rain, t_rain, ET, hail, snow, lightning_strike_count

    # Some observations display only the max value
    obs_type_max = rainRate, p_rainrate, t_rainrate, hailRate, snowRate, UV

    # The sensor status information from the archive, shown until ecwLoop.json is read (or if it has no sensor
    # fields). These lists determine which database fields will be shown, and their order.
    sensor_connections = rxCheckPercent, signal1, signal2, signal3, signal4, signal5, signal6, signal7, signal8
    sensor_batteries = outTempBatteryStatus, inTempBatteryStatus, rainBatteryStatus, hailBatteryStatus, snowBatteryStatus, windBatteryStatus, uvBatteryStatus, txBatteryStatus, batteryStatus1, batteryStatus2, batteryStatus3, batteryStatus4, batteryStatus5, batteryStatus6, batteryStatus7, batteryStatus8
    sensor_voltages = consBatteryVoltage, heatingVoltage, supplyVoltage, referenceVoltage

    # The charts of the history widget are the [day], [week], [month] and [year] groups of charts.conf, and those
    # of the telemetry page the [telemetry_day] ... [telemetry_year] groups. See charts.conf.example.

