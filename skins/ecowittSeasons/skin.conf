###############################################################################

[Units]

    [[StringFormats]]
        # No "N/A": a missing value is shown as nothing, and rows with nothing in them are hidden
        NONE = ""

    [[Ordinates]]
        # The ordinal directions. The last one is for no wind direction: empty, rather than N/A
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW, ""

    [[TimeZone]]
        # The time zone of the charts, in 'Area/Location' format, e.g. Europe/London. Empty: the server's.
        time_zone = ""

###############################################################################

# The CheetahGenerator creates files from templates.  This section
# specifies which files will be generated from which template.

[CheetahGenerator]

    search_list_extensions = user.ecowittseasons_charts.EChartsSearchList, user.ecowittseasons.EcowittSeasonsSearchList

    # Possible encodings include 'html_entities', 'strict_ascii', 'normalized_ascii',
    # as well as those listed in https://docs.python.org/3/library/codecs.html#standard-encodings
    encoding = html_entities

    [[SummaryByMonth]]
        # Reports that summarize "by month"
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        # Reports that summarize "by year"
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl

    [[ToDate]]
        # Reports that show statistics "to date", such as day-to-date,
        # week-to-date, month-to-date, etc.
        [[[index]]]
            template = index.html.tmpl
        [[[statistics]]]
            template = statistics.html.tmpl
        [[[telemetry]]]
            template = telemetry.html.tmpl
        [[[tabular]]]
            template = tabular.html.tmpl
        [[[celestial]]]
            template = celestial.html.tmpl
            # Uncomment the following to generate a celestial page only once
            # an hour instead of every report cycle.
            # stale_age = 3600
        [[[RSS]]]
            template = rss.xml.tmpl
        [[[chart_builder]]]
            template = chart-builder/index.html.tmpl
        [[[echarts_config]]]
            template = js/echarts-config.js.tmpl
            encoding = utf8
        [[[ecowitt_config]]]
            template = js/ecowitt-config.js.tmpl
            encoding = utf8

###############################################################################

# The CopyGenerator copies files from one location to another.

[CopyGenerator]

    # List of files to be copied only the first time the generator runs
    copy_once = favicon.ico, font/*.woff, font/*.woff2, font/*.txt

    # List of files to be copied each time the generator runs, so upgrades reach the web pages
    copy_always = ecowitt-seasons.css, seasons.js, js/echarts-common.js, js/echarts-charts.js, js/echarts-chart-builder.js, js/ecowitt-seasons.js

###############################################################################

[Generators]
        # The list of generators that are to be run. EChartsJsonGenerator writes the chart data (json/*.json)
        # from charts.conf; there is no ImageGenerator.
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator, user.ecowittseasons_charts.EChartsJsonGenerator
